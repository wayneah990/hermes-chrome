<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hermes Chrome</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font: 13px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif;
      background: #121216; color: #f5f0e6;
    }
    body { display: flex; flex-direction: column; }
    header {
      padding: 10px 12px 8px; border-bottom: 1px solid #2a2a32;
      display: flex; align-items: center; gap: 8px;
    }
    header img.lady {
      width: 22px; height: 22px; border-radius: 6px;
      flex: none; background: #fff;
    }
    h1 { font-size: 14px; font-weight: 650; margin: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; }
    .dot.on { background: #c9a227; box-shadow: 0 0 8px #c9a22788; }
    .dot.warn { background: #d97706; }
    .sub { color: #9a917c; font-size: 11px; margin-left: auto; }
    #log {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .row { display: flex; align-items: flex-start; gap: 6px; max-width: 100%; }
    .row.me { align-self: flex-end; flex-direction: row-reverse; }
    .row.bot { align-self: flex-start; }
    .msg { max-width: 92%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
    .row .msg { max-width: min(92%, 280px); }
    .msg.me { align-self: flex-end; background: #c9a227; color: #121216; }
    .msg.bot { align-self: flex-start; background: #1c1c22; border: 1px solid #2a2a32; }
    .msg.sys { align-self: center; color: #9a917c; font-size: 11px; background: none; padding: 0; }
    .msg.busy { color: #c9a227; }
    button.copy {
      flex: none; align-self: flex-start;
      width: 28px; height: 28px; padding: 5px;
      background: transparent; color: #9a917c;
      border: 0; border-radius: 6px;
      cursor: pointer; display: grid; place-items: center;
    }
    button.copy svg { width: 16px; height: 16px; display: block; }
    .row.me button.copy { color: #5a4a12; }
    button.copy:hover { color: #c9a227; background: #c9a22718; }
    footer {
      border-top: 1px solid #2a2a32; padding: 8px; display: flex; gap: 8px;
      flex-wrap: wrap;
    }
    #chips {
      display: none; width: 100%; gap: 6px; flex-wrap: wrap;
    }
    #chips.show { display: flex; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      background: #1c1c22; border: 1px solid #2a2a32; color: #f5f0e6;
      border-radius: 999px; padding: 4px 8px 4px 10px; font-size: 11px;
      max-width: 100%;
    }
    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
    .chip button {
      background: transparent; color: #9a917c; padding: 0; width: 18px; height: 18px;
      border-radius: 50%; font-weight: 700; align-self: center;
    }
    .composer { flex: 1; display: flex; gap: 8px; min-width: 0; }
    #attach {
      flex: none; align-self: flex-end;
      width: 36px; height: 36px; padding: 8px;
      background: transparent; color: #9a917c; border: 1px solid #2a2a32;
    }
    #attach:hover { color: #c9a227; border-color: #c9a227; }
    #attach svg { width: 16px; height: 16px; display: block; }
    #dropmask {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: #c9a22722; border: 2px dashed #c9a227;
      color: #c9a227; font-weight: 650;
      align-items: center; justify-content: center;
    }
    body.drag #dropmask { display: flex; }
    textarea {
      flex: 1; resize: none; min-height: 44px; max-height: 120px;
      background: #1c1c22; color: #f5f0e6; border: 1px solid #2a2a32;
      border-radius: 8px; padding: 8px; font: inherit;
    }
    button {
      background: #c9a227; color: #121216; border: 0; border-radius: 8px;
      padding: 8px 12px; font-weight: 650; cursor: pointer; align-self: flex-end;
    }
    button:disabled { opacity: .45; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div id="dot" class="dot"></div>
    <img class="lady" src="icons/lady-32.png" alt="" />
    <h1>Hermes Chrome</h1>
    <span class="sub" id="state">connecting…</span>
  </header>
  <div id="log"></div>
  <div id="dropmask">Drop image or PDF</div>
  <footer>
    <div id="chips"></div>
    <div class="composer">
      <button id="attach" type="button" title="Attach" aria-label="Attach">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="input" placeholder="Ask Hermes… drop image or PDF here" rows="2"></textarea>
      <button id="send">Send</button>
    </div>
    <input id="file" type="file" accept="image/*,.pdf,application/pdf" multiple hidden />
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
